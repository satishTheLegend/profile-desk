name: profile_desk
description: Private foreground access to separately linked browser profiles.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_svg: 2.3.0
  lottie: 3.6.1
  session_contract:
    path: ../../packages/session_contract
  session_engine:
    path: ../../packages/session_engine
  local_registry:
    path: ../../packages/local_registry

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animations/accounts.json
    - assets/animations/opening.json
    - assets/animations/privacy.json
    - assets/fonts/Manrope-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
