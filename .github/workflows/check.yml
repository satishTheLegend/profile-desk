name: Source and Android checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: ./scripts/bootstrap.sh
      - run: ./scripts/check.sh
      - run: python3 scripts/check_generated.py
      - run: ./scripts/build_android.sh qa debug
      - run: ./gradlew :session_engine:testDebugUnitTest
        working-directory: apps/mobile/android
